services:
  - type: worker
    name: levbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python levbot.py
    envVars:
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
