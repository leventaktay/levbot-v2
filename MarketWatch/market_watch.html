<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Market Watch</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04080f; --surface: #080e1a; --surface2: #0c1422;
  --border: #131f30; --border2: #1c2d42;
  --green: #00e87a; --green-dim: #00a855;
  --red: #ff2255; --red-dim: #cc1a44;
  --amber: #ffaa00; --blue: #00c8ff; --blue-dim: #0077aa;
  --teal: #00ddd0; --text: #6a8aa5; --text-bright: #aac8e8;
  --text-dim: #2a4055; --white: #dceeff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); font-family:'Rajdhani',sans-serif; width:420px; color:var(--text); user-select:none; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.05) 3px,rgba(0,0,0,0.05) 4px); pointer-events:none; z-index:999; }
.widget { border:1px solid var(--border2); box-shadow:0 0 0 1px rgba(0,200,255,0.04),0 0 40px rgba(0,0,0,0.8),inset 0 0 60px rgba(0,200,255,0.02); }

.titlebar { background:var(--surface2); border-bottom:1px solid var(--border2); padding:7px 12px; display:flex; align-items:center; justify-content:space-between; }
.dots { display:flex; gap:6px; align-items:center; }
.dot { width:9px; height:9px; border-radius:50%; }
.dot-r{background:#ff5f57;} .dot-y{background:#ffbd2e;} .dot-g{background:#28c841;}
.tb-title { font-family:'Bebas Neue',monospace; font-size:13px; letter-spacing:3px; color:var(--blue); text-shadow:0 0 12px rgba(0,200,255,0.4); }
.tb-badge { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px; }

.clock-section { background:linear-gradient(135deg,var(--surface),var(--bg)); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:relative; overflow:hidden; }
.clock-section::after { content:''; position:absolute; bottom:0; left:14px; right:14px; height:1px; background:linear-gradient(90deg,transparent,var(--blue-dim),transparent); }
.clock-time { font-family:'Share Tech Mono',monospace; font-size:30px; color:var(--white); letter-spacing:2px; line-height:1; }
.clock-time .secs { font-size:18px; color:var(--blue); opacity:0.8; }
.clock-right { text-align:right; }
.clock-date { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--text-bright); letter-spacing:0.5px; }
.clock-tz { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:2px; margin-top:3px; }

.sec-label { padding:5px 14px; background:var(--surface2); border-bottom:1px solid var(--border); font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:3px; display:flex; justify-content:space-between; align-items:center; }

.region-row { padding:4px 14px 3px; background:var(--bg); border-bottom:1px solid var(--border); font-family:'Share Tech Mono',monospace; font-size:8px; letter-spacing:3px; color:var(--text-dim); display:flex; align-items:center; gap:8px; }
.region-row::after { content:''; flex:1; height:1px; background:var(--border); }

.ex-row { border-bottom:1px solid var(--border); position:relative; transition:background 0.1s; }
.ex-row:hover { background:rgba(255,255,255,0.015); }
.ex-row.is-open::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--green); box-shadow:0 0 8px var(--green); }
.ex-row.is-lunch::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--amber); }

.ex-main { padding:8px 14px 7px; display:grid; grid-template-columns:30px 1fr auto; gap:10px; align-items:center; }

.ex-indicator { display:flex; flex-direction:column; align-items:center; gap:5px; }
.status-dot { width:7px; height:7px; border-radius:50%; }
.status-dot.open  { background:var(--green); box-shadow:0 0 8px var(--green); animation:blink 2.5s ease-in-out infinite; }
.status-dot.closed{ background:var(--text-dim); }
.status-dot.lunch { background:var(--amber); box-shadow:0 0 6px var(--amber); }
.status-dot.pre   { background:var(--teal); box-shadow:0 0 6px var(--teal); animation:blink 3s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.ex-flag { font-size:13px; line-height:1; }

.ex-name { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:var(--text-bright); line-height:1.15; letter-spacing:0.3px; }
.ex-index { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:1.5px; margin-top:1px; }

.ex-right { text-align:right; }
.ex-status { font-family:'Share Tech Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1.5px; line-height:1; }
.ex-status.open  { color:var(--green); }
.ex-status.closed{ color:var(--red-dim); }
.ex-status.lunch { color:var(--amber); }
.ex-status.pre   { color:var(--teal); }
.ex-hours { font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text); margin-top:2px; }
.ex-countdown { font-family:'Share Tech Mono',monospace; font-size:9px; margin-top:2px; color:var(--text-dim); }
.ex-countdown.soon    { color:var(--amber); }
.ex-countdown.opening { color:var(--green-dim); }

/* Chart */
.ex-chart { padding:0 14px 9px 54px; display:flex; flex-direction:column; gap:4px; }
.chart-top { display:flex; justify-content:space-between; align-items:center; }
.chart-change { font-family:'Share Tech Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; }
.chart-change.up   { color:var(--green); }
.chart-change.down { color:var(--red); }
.chart-session-label { font-family:'Share Tech Mono',monospace; font-size:8px; color:var(--text-dim); letter-spacing:1px; }
.sparkline-wrap { position:relative; height:34px; }
.sparkline-wrap svg { width:100%; height:100%; overflow:visible; }
.session-bar-wrap { height:3px; background:rgba(255,255,255,0.04); border-radius:2px; overflow:hidden; }
.session-bar-fill { height:100%; border-radius:2px; }
.session-bar-fill.up   { background:linear-gradient(90deg,var(--green-dim),var(--green)); }
.session-bar-fill.down { background:linear-gradient(90deg,var(--red-dim),var(--red)); }

.footer { padding:6px 14px; background:var(--surface2); border-top:1px solid var(--border2); display:flex; justify-content:space-between; align-items:center; }
.footer-left { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px; }
.open-badge { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; background:rgba(0,232,122,0.08); border:1px solid rgba(0,232,122,0.2); padding:2px 7px; color:var(--green); }
.open-badge.none { background:rgba(255,34,85,0.06); border-color:rgba(255,34,85,0.15); color:var(--red-dim); }
</style>
</head>
<body>
<div class="widget">
  <div class="titlebar">
    <div class="dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
    <div class="tb-title">◈ GLOBAL MARKET WATCH</div>
    <div class="tb-badge">v2.0</div>
  </div>
  <div class="clock-section">
    <div><div class="clock-time" id="clock">--:--<span class="secs">:--</span></div></div>
    <div class="clock-right">
      <div class="clock-date" id="clock-date">---</div>
      <div class="clock-tz">İSTANBUL · UTC+3</div>
    </div>
  </div>
  <div class="sec-label">
    <span>◆ BORSALAR — SAAT İSTANBUL'A GÖRE</span>
    <span id="active-markets">...</span>
  </div>
  <div id="exchange-list"></div>
  <div class="footer">
    <div class="footer-left" id="last-update">GÜNCELLENİYOR...</div>
    <div class="open-badge" id="open-badge">— AÇIK</div>
  </div>
</div>

<script>
const EXCHANGES = [
  { region:'AVRUPA', id:'bist', name:'Borsa İstanbul', index:'BIST 100', flag:'🇹🇷',
    tz:'Europe/Istanbul', open:{h:10,m:0}, close:{h:18,m:0}, lunch:null, premarket:null },
  { id:'frankfurt', name:'Frankfurt XETRA', index:'DAX 40', flag:'🇩🇪',
    tz:'Europe/Berlin', open:{h:9,m:0}, close:{h:17,m:30}, lunch:null, premarket:null },
  { id:'paris', name:'Euronext Paris', index:'CAC 40', flag:'🇫🇷',
    tz:'Europe/Paris', open:{h:9,m:0}, close:{h:17,m:35}, lunch:null, premarket:null },
  { id:'london', name:'London Stock Exch.', index:'FTSE 100', flag:'🇬🇧',
    tz:'Europe/London', open:{h:8,m:0}, close:{h:16,m:30}, lunch:null, premarket:null },
  { region:'AMERİKA', id:'nyse', name:'NYSE', index:'S&P 500', flag:'🇺🇸',
    tz:'America/New_York', open:{h:9,m:30}, close:{h:16,m:0}, lunch:null,
    premarket:{open:{h:4,m:0},close:{h:9,m:30}}, afterhours:{open:{h:16,m:0},close:{h:20,m:0}} },
  { id:'nasdaq', name:'NASDAQ', index:'NASDAQ Composite', flag:'🇺🇸',
    tz:'America/New_York', open:{h:9,m:30}, close:{h:16,m:0}, lunch:null,
    premarket:{open:{h:4,m:0},close:{h:9,m:30}}, afterhours:{open:{h:16,m:0},close:{h:20,m:0}} },
  { region:'ASYA — PASİFİK', id:'tokyo', name:'Tokyo TSE', index:'Nikkei 225', flag:'🇯🇵',
    tz:'Asia/Tokyo', open:{h:9,m:0}, close:{h:15,m:30}, lunch:{start:{h:11,m:30},end:{h:12,m:30}}, premarket:null },
  { id:'shanghai', name:'Shanghai SSE', index:'SSE Composite', flag:'🇨🇳',
    tz:'Asia/Shanghai', open:{h:9,m:30}, close:{h:15,m:0}, lunch:{start:{h:11,m:30},end:{h:13,m:0}}, premarket:null },
  { id:'hk', name:'Hong Kong HKEX', index:'Hang Seng', flag:'🇭🇰',
    tz:'Asia/Hong_Kong', open:{h:9,m:30}, close:{h:16,m:0}, lunch:{start:{h:12,m:0},end:{h:13,m:0}}, premarket:null },
  { id:'sydney', name:'Sydney ASX', index:'ASX 200', flag:'🇦🇺',
    tz:'Australia/Sydney', open:{h:10,m:0}, close:{h:16,m:0}, lunch:null, premarket:null },
];

// Seeded RNG (Mulberry32)
function seededRng(seed) {
  let s = seed;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function strHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function generateSparkData(exId, sessionProgress) {
  const today = new Date().toISOString().slice(0,10);
  const rng = seededRng(strHash(exId + today));
  const POINTS = 60;
  const prices = [0];
  for (let i = 1; i < POINTS; i++) {
    prices.push(prices[i-1] + (rng()-0.47)*0.9 + (rng()-0.5)*0.3);
  }
  const visible = Math.max(3, Math.round(POINTS * Math.min(1, sessionProgress)));
  const slice = prices.slice(0, visible);
  const min = Math.min(...slice), max = Math.max(...slice);
  const range = max - min || 0.01;
  const rawChange = slice[slice.length-1] - slice[0];
  const pctChange = (rawChange / (Math.abs(slice[0]) + 0.01) * 100).toFixed(2);
  const isUp = rawChange >= 0;
  return { slice, min, range, pctChange, isUp };
}

function buildSparklineSVG(data, W, H) {
  const { slice, min, range, isUp } = data;
  const pad = 2;
  const pts = slice.map((v,i) => [
    (i/(slice.length-1))*(W-pad*2)+pad,
    H-pad-((v-min)/range)*(H-pad*2)
  ]);
  const color = isUp ? '#00e87a' : '#ff2255';
  const fill  = isUp ? 'rgba(0,232,122,0.09)' : 'rgba(255,34,85,0.08)';

  let line = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  let area = line + ` L${pts[pts.length-1][0].toFixed(1)},${H} L${pts[0][0].toFixed(1)},${H} Z`;
  const [lx,ly] = pts[pts.length-1];

  let grid = '';
  for (let g=1;g<=3;g++) {
    const gy=((H/4)*g).toFixed(1);
    grid += `<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}
    <path d="${area}" fill="${fill}" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.5" fill="${color}" style="filter:drop-shadow(0 0 4px ${color})"/>
  </svg>`;
}

const pad2 = n => String(n).padStart(2,'0');
const hm = (h,m) => `${pad2(h)}:${pad2(m)}`;

function localNow(tz) {
  const d = new Date();
  const parts = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false}).formatToParts(d);
  const get = t => parts.find(p=>p.type===t)?.value;
  const h=parseInt(get('hour')), m=parseInt(get('minute'));
  return {h,m,wd:get('weekday'),total:h*60+m};
}

function tzDiff(tz) {
  const d = new Date();
  const toMins = t => {
    const p = new Intl.DateTimeFormat('en-US',{timeZone:t,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
    return parseInt(p.find(x=>x.type==='hour').value)*60+parseInt(p.find(x=>x.type==='minute').value);
  };
  let diff = toMins('Europe/Istanbul') - toMins(tz);
  if (diff>720) diff-=1440; if (diff<-720) diff+=1440;
  return diff;
}

function toIst(tz,h,m) {
  const t=((h*60+m+tzDiff(tz))%1440+1440)%1440;
  return {h:Math.floor(t/60),m:t%60};
}

function minsToHuman(mins) {
  if (mins<0) mins=0;
  const h=Math.floor(mins/60),m=mins%60;
  if (!h) return `${m}dk`; if (!m) return `${h}sa`; return `${h}sa ${m}dk`;
}

function getStatus(ex) {
  const {h,m,wd,total}=localNow(ex.tz);
  if (['Sat','Sun'].includes(wd)) return {key:'closed',label:'KAPALI',sub:'HAFTA SONU',progress:0};
  const openM=ex.open.h*60+ex.open.m, closeM=ex.close.h*60+ex.close.m;

  if (ex.premarket) {
    const pmO=ex.premarket.open.h*60+ex.premarket.open.m;
    const pmC=ex.premarket.close.h*60+ex.premarket.close.m;
    if (total>=pmO&&total<pmC) return {key:'pre',label:'PRE-MKT',sub:`${minsToHuman(pmC-total)} sonra açılır`,progress:(total-pmO)/(pmC-pmO)};
  }

  if (total<openM) return {key:'closed',label:'KAPALI',sub:`${minsToHuman(openM-total)} sonra açılır`,subCls:'opening',progress:0};

  if (total>=closeM) {
    if (ex.afterhours) {
      const ahC=ex.afterhours.close.h*60+ex.afterhours.close.m;
      if (total<ahC) return {key:'pre',label:'AH-MKT',sub:`${minsToHuman(ahC-total)} sonra biter`,progress:(total-closeM)/(ahC-closeM)};
    }
    return {key:'closed',label:'KAPALI',sub:'Seans bitti',progress:1};
  }

  if (ex.lunch) {
    const ls=ex.lunch.start.h*60+ex.lunch.start.m, le=ex.lunch.end.h*60+ex.lunch.end.m;
    if (total>=ls&&total<le) return {key:'lunch',label:'ÖĞLE',sub:`${minsToHuman(le-total)} sonra açılır`,subCls:'opening',progress:(ls-openM)/(closeM-openM)};
  }

  const progress=(total-openM)/(closeM-openM);
  const rem=closeM-total;
  return {key:'open',label:'AÇIK',sub:rem<=60?`${minsToHuman(rem)} sonra kapanır`:`${minsToHuman(rem)} açık kalır`,subCls:rem<=30?'soon':'',progress};
}

function render() {
  const list = document.getElementById('exchange-list');
  let html='', openCount=0, lastRegion='';

  EXCHANGES.forEach(ex => {
    if (ex.region&&ex.region!==lastRegion) { lastRegion=ex.region; html+=`<div class="region-row">${ex.region}</div>`; }

    const st = getStatus(ex);
    if (st.key==='open') openCount++;

    const rowCls = st.key==='open'?'is-open':st.key==='lunch'?'is-lunch':'';
    const oIst=toIst(ex.tz,ex.open.h,ex.open.m), cIst=toIst(ex.tz,ex.close.h,ex.close.m);
    let hoursLabel=`${hm(oIst.h,oIst.m)} – ${hm(cIst.h,cIst.m)}`;
    if (ex.lunch) {
      const lsIst=toIst(ex.tz,ex.lunch.start.h,ex.lunch.start.m), leIst=toIst(ex.tz,ex.lunch.end.h,ex.lunch.end.m);
      hoursLabel+=`<br><span style="font-size:8px;color:var(--text-dim)">öğle ${hm(lsIst.h,lsIst.m)}–${hm(leIst.h,leIst.m)}</span>`;
    }

    const subHtml=st.sub?`<div class="ex-countdown ${st.subCls||''}">${st.sub}</div>`:'';

    let chartHtml='';
    if (st.key==='open') {
      const sp=generateSparkData(ex.id,st.progress);
      const cls=sp.isUp?'up':'down';
      const sign=sp.isUp?'+':'';
      const svg=buildSparklineSVG(sp,330,34);
      const pct=(st.progress*100).toFixed(1);
      chartHtml=`<div class="ex-chart">
        <div class="chart-top">
          <span class="chart-change ${cls}">${sign}${sp.pctChange}%</span>
          <span class="chart-session-label">SEANS %${pct}</span>
        </div>
        <div class="sparkline-wrap">${svg}</div>
        <div class="session-bar-wrap"><div class="session-bar-fill ${cls}" style="width:${pct}%"></div></div>
      </div>`;
    }

    html+=`<div class="ex-row ${rowCls}">
      <div class="ex-main">
        <div class="ex-indicator"><div class="status-dot ${st.key}"></div><div class="ex-flag">${ex.flag}</div></div>
        <div><div class="ex-name">${ex.name}</div><div class="ex-index">${ex.index}</div></div>
        <div class="ex-right"><div class="ex-status ${st.key}">${st.label}</div><div class="ex-hours">${hoursLabel}</div>${subHtml}</div>
      </div>${chartHtml}</div>`;
  });

  list.innerHTML=html;

  const now=new Date();
  const ts=now.toLocaleTimeString('tr-TR',{timeZone:'Europe/Istanbul',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('last-update').textContent=`SON GÜNCELLEME: ${ts}`;
  const badge=document.getElementById('open-badge');
  badge.textContent=`${openCount} / ${EXCHANGES.length} AÇIK`;
  badge.className='open-badge'+(openCount===0?' none':'');
  document.getElementById('active-markets').textContent=openCount>0?`${openCount} PIYASA AKTİF`:'TÜM PIYASALAR KAPALI';
}

function updateClock() {
  const now=new Date();
  const full=now.toLocaleTimeString('tr-TR',{timeZone:'Europe/Istanbul',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').innerHTML=`${full.slice(0,5)}<span class="secs">:${full.slice(6,8)}</span>`;
  const date=now.toLocaleDateString('tr-TR',{timeZone:'Europe/Istanbul',weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('clock-date').textContent=date.toUpperCase();
}

function tick() { updateClock(); render(); }
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
